<!DOCTYPE html>
<html>
<head>
    <title>Clear Service Worker</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            max-width: 600px;
            margin: 100px auto;
            padding: 20px;
            text-align: center;
        }
        h1 { color: #333; }
        .loading { color: #666; }
        .success { color: #22c55e; }
        .info { 
            background: #f0f9ff; 
            padding: 15px; 
            border-radius: 8px; 
            margin-top: 20px;
            color: #0369a1;
        }
    </style>
</head>
<body>
    <h1 class="loading">🔄 Clearing Service Worker...</h1>
    <p class="loading">Please wait...</p>
    <script>
        if ('serviceWorker' in navigator) {
            Promise.all([
                // Unregister all service workers
                navigator.serviceWorker.getRegistrations().then(registrations => {
                    return Promise.all(
                        registrations.map(reg => {
                            console.log('Unregistering:', reg);
                            return reg.unregister();
                        })
                    );
                }),
                // Clear all caches
                caches.keys().then(cacheNames => {
                    return Promise.all(
                        cacheNames.map(cacheName => {
                            console.log('Deleting cache:', cacheName);
                            return caches.delete(cacheName);
                        })
                    );
                })
            ]).then(() => {
                document.body.innerHTML = `
                    <h1 class="success">✅ Service Worker Cleared!</h1>
                    <p class="success">All service workers and caches have been removed.</p>
                    <div class="info">
                        <p><strong>ℹ️ Development Mode</strong></p>
                        <p>Service Worker is now disabled in development mode.</p>
                        <p>It will only run in production builds.</p>
                    </div>
                    <p style="margin-top: 30px;">
                        <a href="/" style="
                            display: inline-block;
                            padding: 12px 24px;
                            background: #3b82f6;
                            color: white;
                            text-decoration: none;
                            border-radius: 6px;
                            font-weight: 500;
                        ">← Back to Site</a>
                    </p>
                `;
            }).catch(err => {
                console.error('Error clearing SW:', err);
                document.body.innerHTML = `
                    <h1 style="color: #ef4444;">❌ Error</h1>
                    <p>Failed to clear service worker: ${err.message}</p>
                `;
            });
        } else {
            document.body.innerHTML = `
                <h1 style="color: #f59e0b;">⚠️ Not Supported</h1>
                <p>Service Workers are not supported in this browser.</p>
            `;
        }
    </script>
</body>
</html>
