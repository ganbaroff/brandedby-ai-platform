<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clear Service Worker</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 50px auto;
      padding: 20px;
      background: #f5f5f5;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    button {
      background: #dc2626;
      color: white;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 10px;
    }
    button:hover {
      background: #b91c1c;
    }
    .success {
      color: #16a34a;
      font-weight: bold;
    }
    .error {
      color: #dc2626;
      font-weight: bold;
    }
    #status {
      margin-top: 20px;
      padding: 15px;
      border-radius: 6px;
      display: none;
    }
    #status.show {
      display: block;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🧹 Clear Service Worker</h1>
    <p>This page will unregister all Service Workers and clear caches.</p>
    
    <button onclick="clearEverything()">Clear All Service Workers & Caches</button>
    
    <div id="status"></div>
  </div>

  <script>
    async function clearEverything() {
      const status = document.getElementById('status');
      status.className = 'show';
      status.innerHTML = '<p>⏳ Clearing everything...</p>';

      try {
        let swCount = 0;
        let cacheCount = 0;

        // Unregister all service workers
        if ('serviceWorker' in navigator) {
          const registrations = await navigator.serviceWorker.getRegistrations();
          swCount = registrations.length;
          for (let registration of registrations) {
            await registration.unregister();
            console.log('✅ Unregistered:', registration.scope);
          }
        }

        // Clear all caches
        if ('caches' in window) {
          const cacheNames = await caches.keys();
          cacheCount = cacheNames.length;
          for (let cacheName of cacheNames) {
            await caches.delete(cacheName);
            console.log('✅ Deleted cache:', cacheName);
          }
        }

        // Clear localStorage
        localStorage.clear();
        console.log('✅ localStorage cleared');

        // Clear sessionStorage
        sessionStorage.clear();
        console.log('✅ sessionStorage cleared');

        status.innerHTML = `
          <p class="success">✅ Success!</p>
          <p>Service Workers: ${swCount} unregistered</p>
          <p>Caches: ${cacheCount} cleared</p>
          <p>localStorage & sessionStorage: cleared</p>
          <p><strong style="color: #dc2626; font-size: 18px;">
            NOW: Close this tab and ALL other localhost:5173 tabs, 
            then open a FRESH tab with the URL.
          </strong></p>
          <button onclick="window.close()">Close This Tab</button>
        `;

        // Try to reload after 2 seconds
        setTimeout(() => {
          status.innerHTML += '<p>🔄 Attempting to reload in 3 seconds...</p>';
          setTimeout(() => {
            window.location.href = '/';
          }, 3000);
        }, 2000);

      } catch (error) {
        status.innerHTML = `<p class="error">❌ Error: ${error.message}</p>`;
        console.error('Error clearing:', error);
      }
    }

    // Auto-run on load
    window.addEventListener('load', () => {
      clearEverything();
    });
  </script>
</body>
</html>
