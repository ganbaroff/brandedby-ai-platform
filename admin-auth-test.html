<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Auth Test</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            max-width: 800px; 
            margin: 20px auto; 
            padding: 20px;
        }
        button { 
            padding: 10px 20px; 
            margin: 10px; 
            background: #007bff; 
            color: white; 
            border: none; 
            border-radius: 4px; 
            cursor: pointer;
        }
        button:hover { background: #0056b3; }
        .result { 
            padding: 10px; 
            margin: 10px 0; 
            border-radius: 4px; 
            font-family: monospace;
        }
        .success { background: #d4edda; color: #155724; }
        .error { background: #f8d7da; color: #721c24; }
        .info { background: #e2e3e5; color: #383d41; }
    </style>
</head>
<body>
    <h1>Admin Authentication Test</h1>
    
    <div>
        <h3>Test Credentials:</h3>
        <p>Username: <code>admin</code></p>
        <p>Password: <code>admin</code></p>
    </div>

    <div>
        <h3>Actions:</h3>
        <button onclick="testLogin()">Test Login</button>
        <button onclick="checkAuth()">Check Authentication</button>
        <button onclick="getSession()">Get Session Info</button>
        <button onclick="testLogout()">Logout</button>
        <button onclick="clearStorage()">Clear Storage</button>
    </div>

    <div id="results"></div>

    <script>
        // Admin auth utilities (copy from our implementation)
        class AdminAuth {
            static SESSION_KEY = 'brandedby_admin_session';
            static SESSION_DURATION = 24 * 60 * 60 * 1000; // 24 hours

            static isAuthenticated() {
                try {
                    console.log('🔍 AdminAuth.isAuthenticated() called');
                    const session = localStorage.getItem(this.SESSION_KEY);
                    console.log('📄 Retrieved session data:', session);
                    
                    if (!session) {
                        console.log('❌ No session found');
                        return false;
                    }

                    const sessionData = JSON.parse(session);
                    console.log('📋 Parsed session:', sessionData);
                    
                    if (!sessionData.loggedIn) {
                        console.log('❌ Session not logged in');
                        return false;
                    }

                    if (sessionData.expiresAt) {
                        const now = new Date().getTime();
                        const expires = new Date(sessionData.expiresAt).getTime();
                        console.log('⏰ Session expiry check:', { now, expires, expired: now > expires });
                        if (now > expires) {
                            console.log('⏰ Session expired, logging out');
                            this.logout();
                            return false;
                        }
                    }

                    console.log('✅ Session valid');
                    return true;
                } catch (error) {
                    console.error('❌ Error checking admin authentication:', error);
                    return false;
                }
            }

            static createSession(username) {
                const session = {
                    loggedIn: true,
                    timestamp: new Date().toISOString(),
                    user: username,
                    expiresAt: new Date(Date.now() + this.SESSION_DURATION).toISOString()
                };

                localStorage.setItem(this.SESSION_KEY, JSON.stringify(session));
                console.log('✅ Admin session created for:', username);
            }

            static logout() {
                localStorage.removeItem(this.SESSION_KEY);
                console.log('🚪 Admin logged out');
            }

            static getSessionInfo() {
                const session = localStorage.getItem(this.SESSION_KEY);
                return session ? JSON.parse(session) : null;
            }
        }

        const ADMIN_CREDENTIALS = {
            username: 'admin',
            password: 'admin'
        };

        function validateCredentials(username, password) {
            return username === ADMIN_CREDENTIALS.username && password === ADMIN_CREDENTIALS.password;
        }

        function addResult(message, type = 'info') {
            const div = document.createElement('div');
            div.className = `result ${type}`;
            div.textContent = message;
            document.getElementById('results').appendChild(div);
        }

        function testLogin() {
            console.log('🔐 Testing login...');
            addResult('Testing login with admin/admin credentials...', 'info');
            
            const isValid = validateCredentials('admin', 'admin');
            console.log('🔍 Credentials validation:', isValid);
            addResult(`Credentials validation: ${isValid}`, isValid ? 'success' : 'error');
            
            if (isValid) {
                try {
                    AdminAuth.createSession('admin');
                    addResult('✅ Session created successfully!', 'success');
                } catch (error) {
                    console.error('❌ Session creation failed:', error);
                    addResult(`❌ Session creation failed: ${error.message}`, 'error');
                }
            }
        }

        function checkAuth() {
            console.log('🔍 Checking authentication...');
            const isAuthenticated = AdminAuth.isAuthenticated();
            addResult(`Authentication status: ${isAuthenticated}`, isAuthenticated ? 'success' : 'error');
        }

        function getSession() {
            const session = AdminAuth.getSessionInfo();
            addResult(`Session info: ${JSON.stringify(session, null, 2)}`, session ? 'success' : 'error');
        }

        function testLogout() {
            AdminAuth.logout();
            addResult('Logged out successfully', 'info');
        }

        function clearStorage() {
            localStorage.clear();
            addResult('Local storage cleared', 'info');
        }

        // Initial check
        window.onload = function() {
            addResult('Page loaded - testing authentication system...', 'info');
            checkAuth();
        }
    </script>
</body>
</html>
